#CI项目
name: QCA-ALL

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  check:
    name: Check Running Builds
    runs-on: ubuntu-latest
    outputs:
      skip: ${{steps.check.outputs.skip}}
    steps:
      - name: Check Running Builds
        id: check
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          # 检查当前是否有正在运行的同类编译任务（排除本次 run），有则跳过本次编译
          RUNNING=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[]
              | select(.id != ${{ github.run_id }})
              | select(.status == "in_progress" or .status == "queued" or .status == "requested" or .status == "waiting")
              | select(.name == "${{ github.workflow }}")
            ] | length') || { echo "查询编译状态失败，本次编译跳过！"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "${RUNNING:-0}" -gt 0 ]; then
            echo "检测到 $RUNNING 个正在编译的同类任务，本次编译不执行！"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "当前没有正在编译的同类任务，继续编译。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  config:
    name: ${{matrix.CONFIG}}
    needs: check
    if: ${{ needs.check.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        # CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO, IPQ807X-WIFI-YES, IPQ807X-WIFI-NO]
        CONFIG: [IPQ60XX-WIFI-YES]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: TK-WRT
      #默认WIFI名称
      WRT_SSID: TK-WRT
      #默认WIFI密码
      WRT_WORD: tk12345678
      #默认地址
      WRT_IP: 192.168.99.1
      #默认密码，仅作提示，修改无用
      WRT_PW: xxxx
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
    #私有源码仓库拉取凭据
    secrets:
      FRP_PAT: ${{secrets.FRP_PAT}}