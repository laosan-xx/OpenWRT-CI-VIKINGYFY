#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          sed -i '1i\src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '1i\src-git passwall_luci https://github.com/laosan-xx/openwrt-passwall.git;main' feeds.conf.default

          ./scripts/feeds update -a

          rm -rf feeds/packages/lang/golang
          git clone --depth=1 https://github.com/sbwml/packages_lang_golang -b 27.x feeds/packages/lang/golang

          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Remove Shadowsocks and Rust components
        run: |
          cd ./wrt/

          # 1. 彻底关闭 PassWall 内的组件开关
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client is not set/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server is not set/' .config

          # 2. 彻底关闭底层所有相关包
          sed -i 's/CONFIG_PACKAGE_shadowsocks-libev.*=y/# CONFIG_PACKAGE_shadowsocks-libev is not set/' .config
          sed -i 's/CONFIG_PACKAGE_shadowsocks-rust.*=y/# CONFIG_PACKAGE_shadowsocks-rust is not set/' .config

          # 3. 额外保险：强制在文件末尾注入禁用指令，防止被依赖关系反选
          echo "CONFIG_PACKAGE_shadowsocks-libev-ss-local=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-libev-ss-redir=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-libev-ss-server=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust-sslocal=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust-ssmanager=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust-ssserver=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust-ssservice=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust-ssurl=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=n" >> .config

          # 最后应用配置
          make defconfig -j$(nproc)

      - name: Verify Removal
        run: |
          cd ./wrt/
          grep "shadowsocks" .config || echo "Successfully removed!"

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          # make -j1 V=s
          make -j$(nproc) || make -j1 V=s

      #检查本次是否编译出 sing-box 软件包，有则发布到 passwall 仓库
      - name: Publish Sing-box Package
        if: ${{ !inputs.WRT_TEST }}
        env:
          GH_TOKEN: ${{secrets.PASSWALL_PAT}}
        run: |
          cd ./wrt/

          #收集编译产物（per-device rootfs 下同一 ipk 会有多份副本，同名覆盖即去重）
          mkdir -p ./singbox-upload
          find ./bin -type f \( -name 'sing-box_*.ipk' -o -name 'sing-box-*.apk' \) -exec cp -f {} ./singbox-upload/ \; 2>/dev/null || true

          if [ -z "$(ls -A ./singbox-upload 2>/dev/null)" ]; then
            echo "::notice::本次未编译出 sing-box 软件包，跳过发布。"
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 PASSWALL_PAT，跳过发布。"
            exit 0
          fi

          REPO="laosan-xx/openwrt-passwall"
          echo "已找到 sing-box 软件包："
          ls -lh ./singbox-upload/

          #release tag 取 sing-box 版本号（ipk 优先，其次 apk），两种命名归一到同一 tag：
          #  sing-box_1.14.2-r1_aarch64_cortex-a53.ipk -> sing-box-1.14.2-r1
          #  sing-box-1.14.2-r1.apk                    -> sing-box-1.14.2-r1
          VER=""
          for f in ./singbox-upload/sing-box_*.ipk ./singbox-upload/sing-box-*.apk; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            v=${b#sing-box}
            v=${v#[-_]}       #去掉 sing-box 后的 - 或 _
            v=${v%.*}         #去掉 .ipk / .apk 后缀
            v=${v%%_*}        #去掉 _架构 后缀
            [ -n "$v" ] && { VER="$v"; break; }
          done
          TAG="sing-box-${VER:-latest}"

          #说明按仓库分区：每行以本仓库唯一标记开头，合并时只替换自己那一行，互不覆盖
          MARK="[CI:${GITHUB_REPOSITORY}/${WRT_BRANCH}]"
          NOTE="${MARK} sing-box 编译产物，由 ${GITHUB_REPOSITORY} CI 于 ${WRT_DATE} 自动发布。"
          BODY=/tmp/singbox-release-body.md

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" ./singbox-upload/* --repo "$REPO" --clobber
          else
            #被另一仓库抢先创建时（并发），退化为上传，不让整个任务失败
            gh release create "$TAG" ./singbox-upload/* --repo "$REPO" \
              --title "$TAG" --notes "$NOTE" \
            || gh release upload "$TAG" ./singbox-upload/* --repo "$REPO" --clobber
          fi

          #重读最新说明：删本仓库旧行、留其它项目的行、追加本仓库新行（幂等，重跑不会重复）
          for i in 1 2 3; do
            gh release view "$TAG" --repo "$REPO" --json body -q .body > "$BODY" || : > "$BODY"
            grep -vF "$MARK" "$BODY" > "$BODY.new" || :
            printf '%s\n' "$NOTE" >> "$BODY.new"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$BODY.new" && break
            sleep $((RANDOM % 5 + 2))
          done

          echo "已发布至 https://github.com/$REPO/releases/tag/$TAG"

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-LAOSAN-${{github.ref_name}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
